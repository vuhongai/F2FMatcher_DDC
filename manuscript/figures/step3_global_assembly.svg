<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1035" viewBox="0 0 1900 1035" font-family="Helvetica, Arial, sans-serif">
  <rect width="1900" height="1035" fill="#ffffff"/>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker>
    <marker id="a3g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  </defs>

  <text x="45" y="52" font-size="30" font-style="italic" fill="#111">Step &#9314; &#8212; Global assembly</text>
  <text x="45" y="86" font-size="18" fill="#3a7d44">Stitch local evidence (Step &#9313;) into one section-wide, 1-to-1 correspondence &#183; reasons at a WIDER spatial scale</text>

  <!-- ============================ ROW A : SEEDS ============================ -->
  <text x="45" y="150" font-size="19" font-weight="bold" fill="#3a7d44">A &#183; Triangle-consistent seeds</text>
  <!-- field 1 -->
  <rect x="55" y="165" width="320" height="200" rx="10" fill="#f4f8fc" stroke="#2c6fbb" stroke-width="1.6"/>
  <text x="65" y="185" font-size="12" fill="#2c6fbb">section 1</text>
  <g fill="#cfcfcf">
    <circle cx="110" cy="220" r="5"/><circle cx="160" cy="250" r="5"/><circle cx="220" cy="215" r="5"/><circle cx="300" cy="235" r="5"/><circle cx="130" cy="330" r="5"/><circle cx="270" cy="310" r="5"/><circle cx="340" cy="300" r="5"/><circle cx="195" cy="345" r="5"/>
  </g>
  <polygon points="150,320 320,270 245,200" fill="none" stroke="#3a7d44" stroke-width="2.2"/>
  <circle cx="150" cy="320" r="7" fill="#3a7d44"/><circle cx="320" cy="270" r="7" fill="#3a7d44"/><circle cx="245" cy="200" r="7" fill="#3a7d44"/>
  <!-- field 2 -->
  <rect x="430" y="165" width="320" height="200" rx="10" fill="#fdf6ee" stroke="#c98a2b" stroke-width="1.6"/>
  <text x="440" y="185" font-size="12" fill="#c98a2b">section 2</text>
  <g fill="#cfcfcf">
    <circle cx="500" cy="230" r="5"/><circle cx="560" cy="255" r="5"/><circle cx="610" cy="220" r="5"/><circle cx="700" cy="250" r="5"/><circle cx="520" cy="335" r="5"/><circle cx="660" cy="320" r="5"/><circle cx="720" cy="305" r="5"/><circle cx="590" cy="350" r="5"/>
  </g>
  <polygon points="535,325 705,285 625,210" fill="none" stroke="#3a7d44" stroke-width="2.2"/>
  <circle cx="535" cy="325" r="7" fill="#3a7d44"/><circle cx="705" cy="285" r="7" fill="#3a7d44"/><circle cx="625" cy="210" r="7" fill="#3a7d44"/>
  <text x="402" y="272" font-size="26" text-anchor="middle" fill="#3a7d44">&#8776;</text>
  <text x="402" y="300" font-size="12.5" text-anchor="middle" fill="#3a7d44">congruent</text>

  <!-- ============================ ROW B : PROPAGATION ============================ -->
  <text x="45" y="440" font-size="19" font-weight="bold" fill="#3a7d44">B &#183; Iterative local propagation</text>
  <rect x="55" y="455" width="695" height="205" rx="10" fill="#f6faf5" stroke="#8bbf86" stroke-width="1.6"/>
  <g stroke="#bcd9b8" stroke-width="1.4" fill="none" stroke-dasharray="5 5">
    <circle cx="205" cy="557" r="42"/><circle cx="205" cy="557" r="74"/><circle cx="205" cy="557" r="100"/>
  </g>
  <!-- matched (green) near seed -->
  <g fill="#3a7d44">
    <circle cx="200" cy="558" r="7"/><circle cx="160" cy="530" r="5.5"/><circle cx="245" cy="540" r="5.5"/><circle cx="180" cy="600" r="5.5"/><circle cx="255" cy="590" r="5.5"/><circle cx="300" cy="560" r="5.5"/><circle cx="140" cy="575" r="5.5"/>
  </g>
  <!-- frontier fibre being validated -->
  <polygon points="255,590 300,560 355,560" fill="none" stroke="#3a7d44" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="355" cy="560" r="7" fill="#9ccf97" stroke="#3a7d44" stroke-width="2"/>
  <text x="360" y="540" font-size="11.5" fill="#3a7d44">validate vs 3 nearest matched</text>
  <!-- unmatched (gray) outward -->
  <g fill="#cfcfcf">
    <circle cx="430" cy="530" r="5.5"/><circle cx="480" cy="590" r="5.5"/><circle cx="540" cy="540" r="5.5"/><circle cx="590" cy="600" r="5.5"/><circle cx="640" cy="545" r="5.5"/><circle cx="690" cy="595" r="5.5"/><circle cx="700" cy="520" r="5.5"/>
  </g>
  <path d="M330 640 L620 640" stroke="#3a7d44" stroke-width="2.4" fill="none" marker-end="url(#a3)"/>
  <text x="475" y="633" font-size="12.5" text-anchor="middle" fill="#3a7d44">wave-front grows outward</text>

  <!-- ============================ ROW C : AFFINE FILL ============================ -->
  <text x="45" y="730" font-size="19" font-weight="bold" fill="#3a7d44">C &#183; Affine-transform fill</text>
  <rect x="55" y="745" width="695" height="205" rx="10" fill="#f7f7fb" stroke="#9aa0bf" stroke-width="1.6"/>
  <!-- warped affine grid -->
  <g stroke="#d3d6e6" stroke-width="1.2" fill="none">
    <path d="M90 780 L360 770 L640 785"/>
    <path d="M100 840 L370 832 L650 848"/>
    <path d="M110 905 L380 898 L660 912"/>
    <path d="M120 775 L150 910"/><path d="M250 772 L275 905"/><path d="M380 770 L400 900"/><path d="M510 776 L525 907"/><path d="M630 782 L645 912"/>
  </g>
  <!-- matched (green) -->
  <g fill="#3a7d44">
    <circle cx="150" cy="810" r="5.5"/><circle cx="230" cy="850" r="5.5"/><circle cx="300" cy="800" r="5.5"/><circle cx="380" cy="860" r="5.5"/><circle cx="460" cy="820" r="5.5"/><circle cx="540" cy="870" r="5.5"/><circle cx="610" cy="815" r="5.5"/>
  </g>
  <!-- unmatched (red) projected -->
  <circle cx="200" cy="905" r="6.5" fill="#c0392b"/><circle cx="330" cy="900" r="6.5" fill="#c0392b" opacity="0"/>
  <circle cx="480" cy="905" r="6.5" fill="#c0392b"/>
  <circle cx="300" cy="915" r="9" fill="none" stroke="#3a7d44" stroke-width="2" stroke-dasharray="3 2"/>
  <circle cx="585" cy="905" r="9" fill="none" stroke="#3a7d44" stroke-width="2" stroke-dasharray="3 2"/>
  <path d="M209 905 L289 913" stroke="#c0392b" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#a3g)"/>
  <path d="M489 905 L574 905" stroke="#c0392b" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#a3g)"/>
  <text x="655" y="800" font-size="11.5" fill="#c0392b">unmatched</text>
  <text x="655" y="905" font-size="11.5" fill="#3a7d44">predicted spot</text>

  <!-- ============================ RATIONALE COLUMN ============================ -->
  <line x1="820" y1="130" x2="820" y2="915" stroke="#e2e2e2" stroke-width="1.5"/>

  <text x="855" y="188" font-size="18" font-weight="bold" fill="#3a7d44">A &#183; Seeds = global anchors</text>
  <text x="855" y="216" font-size="15.5" fill="#333">A few pairs whose centroid triangles are congruent</text>
  <text x="855" y="238" font-size="15.5" fill="#333">across the <tspan font-weight="bold">whole section</tspan>. Strict gate (S &gt; 0.75) +</text>
  <text x="855" y="260" font-size="15.5" fill="#333">joint geometry &#8658; almost surely correct.</text>
  <text x="855" y="282" font-size="15.5" fill="#777">Everything propagates from them, so they must be right.</text>

  <text x="855" y="470" font-size="18" font-weight="bold" fill="#3a7d44">B &#183; Propagation = local-rigid wave-front</text>
  <text x="855" y="498" font-size="15.5" fill="#333">Grow outward; admit a new match only if its triangle</text>
  <text x="855" y="520" font-size="15.5" fill="#333">with the 3 nearest confirmed matches is congruent.</text>
  <text x="855" y="542" font-size="15.5" fill="#333">Tissue distortion is non-linear &#8658; assume rigidity only</text>
  <text x="855" y="564" font-size="15.5" fill="#333"><tspan font-weight="bold">locally</tspan>, yet coverage grows section-wide.</text>
  <text x="855" y="586" font-size="15.5" fill="#777">Re-validation + patience purge stop one early error spreading.</text>

  <text x="855" y="760" font-size="18" font-weight="bold" fill="#3a7d44">C &#183; Affine fill = global search prior</text>
  <text x="855" y="788" font-size="15.5" fill="#333">Fit one section-wide affine to all matches; project the</text>
  <text x="855" y="810" font-size="15.5" fill="#333">leftover isolated fibres to <tspan font-weight="bold">locate</tspan> candidates.</text>
  <text x="855" y="832" font-size="15.5" fill="#333">The affine only localises &#8212; appearance (S &gt; 0.5) + local-</text>
  <text x="855" y="854" font-size="15.5" fill="#333">triangle geometry still gate every acceptance.</text>

  <!-- bottom banner -->
  <rect x="55" y="966" width="1790" height="54" rx="10" fill="#eaf3ea" stroke="#3a7d44" stroke-width="1.6"/>
  <text x="950" y="999" font-size="16.5" text-anchor="middle" fill="#1f5a2a"><tspan font-weight="bold">Local evidence proposes; global geometry disposes.</tspan>  Coarse-to-fine confidence:  few global anchors &#8594; local-rigid wave-front &#8594; global-affine clean-up.</text>
</svg>
