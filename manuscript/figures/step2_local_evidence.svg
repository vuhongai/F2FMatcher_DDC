<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="980" viewBox="0 0 1900 980" font-family="Helvetica, Arial, sans-serif">
  <rect width="1900" height="980" fill="#ffffff"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker>
  </defs>

  <text x="45" y="52" font-size="30" font-style="italic" fill="#111">Step &#9313; &#8212; Local evidence</text>
  <text x="45" y="86" font-size="18" fill="#b9772a">Describe each fibre by itself AND its surroundings &#183; both cost terms are purely LOCAL</text>

  <!-- ================= APPEARANCE (context-aware) ================= -->
  <text x="45" y="150" font-size="19" font-weight="bold" fill="#2c6fbb">Appearance &#8212; context-aware embedding</text>

  <!-- patch A -->
  <rect x="60" y="175" width="150" height="150" rx="8" fill="#f4f8fc" stroke="#2c6fbb" stroke-width="2"/>
  <ellipse cx="100" cy="215" rx="20" ry="15" fill="#eee" stroke="#bbb"/>
  <ellipse cx="170" cy="210" rx="18" ry="20" fill="#eee" stroke="#bbb"/>
  <ellipse cx="160" cy="285" rx="20" ry="16" fill="#eee" stroke="#bbb"/>
  <ellipse cx="90" cy="285" rx="16" ry="18" fill="#eee" stroke="#bbb"/>
  <ellipse cx="133" cy="250" rx="26" ry="22" fill="#cfe0f0" stroke="#2c6fbb" stroke-width="2.5"/>
  <circle cx="133" cy="250" r="3" fill="#2c6fbb"/>
  <text x="135" y="345" font-size="13.5" text-anchor="middle" fill="#333">patch, section 1</text>
  <text x="135" y="363" font-size="12" text-anchor="middle" fill="#888">fibre i + neighbours</text>

  <!-- patch B -->
  <rect x="60" y="400" width="150" height="150" rx="8" fill="#fdf6ee" stroke="#c98a2b" stroke-width="2"/>
  <ellipse cx="100" cy="440" rx="18" ry="16" fill="#eee" stroke="#bbb"/>
  <ellipse cx="172" cy="438" rx="16" ry="18" fill="#eee" stroke="#bbb"/>
  <ellipse cx="158" cy="510" rx="20" ry="15" fill="#eee" stroke="#bbb"/>
  <ellipse cx="92" cy="512" rx="17" ry="16" fill="#eee" stroke="#bbb"/>
  <ellipse cx="133" cy="475" rx="26" ry="22" fill="#f0dcc0" stroke="#c98a2b" stroke-width="2.5"/>
  <circle cx="133" cy="475" r="3" fill="#c98a2b"/>
  <text x="135" y="570" font-size="13.5" text-anchor="middle" fill="#333">patch, section 2</text>
  <text x="135" y="588" font-size="12" text-anchor="middle" fill="#888">fibre j + neighbours</text>

  <!-- VAE encoders -->
  <polygon points="255,205 340,225 340,285 255,305" fill="#eef3f8" stroke="#333" stroke-width="1.8"/>
  <text x="297" y="252" font-size="12.5" text-anchor="middle" fill="#111">VAE</text>
  <text x="297" y="268" font-size="12.5" text-anchor="middle" fill="#111">enc.</text>
  <polygon points="255,430 340,450 340,510 255,530" fill="#fdf6ee" stroke="#333" stroke-width="1.8"/>
  <text x="297" y="477" font-size="12.5" text-anchor="middle" fill="#111">VAE</text>
  <text x="297" y="493" font-size="12.5" text-anchor="middle" fill="#111">enc.</text>
  <text x="297" y="378" font-size="11.5" text-anchor="middle" fill="#c0392b">shared &#183; frozen</text>
  <path d="M297 305 L297 430" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- mu bars -->
  <rect x="372" y="228" width="20" height="60" rx="3" fill="#fff" stroke="#2c6fbb" stroke-width="2"/>
  <text x="382" y="218" font-size="13" text-anchor="middle" fill="#2c6fbb">&#956;&#7522;</text>
  <rect x="372" y="453" width="20" height="60" rx="3" fill="#fff" stroke="#c98a2b" stroke-width="2"/>
  <text x="382" y="533" font-size="13" text-anchor="middle" fill="#c98a2b">&#956;&#11388;</text>

  <!-- classifier -->
  <rect x="440" y="300" width="180" height="120" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="530" y="348" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">Pairwise</text>
  <text x="530" y="370" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">classifier</text>
  <text x="530" y="393" font-size="12" text-anchor="middle" fill="#666">512&#8594;128&#8594;64&#8594;1</text>

  <!-- S node -->
  <rect x="670" y="330" width="120" height="60" rx="8" fill="#eaf1f8" stroke="#2c6fbb" stroke-width="2.2"/>
  <text x="730" y="358" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">S[i,j]</text>
  <text x="730" y="377" font-size="11.5" text-anchor="middle" fill="#555">appearance</text>

  <!-- appearance arrows -->
  <g stroke="#222" stroke-width="2" fill="none" marker-end="url(#a2)">
    <path d="M212 250 L251 250"/><path d="M212 475 L251 475"/>
    <path d="M342 255 L370 255"/><path d="M342 480 L370 480"/>
    <path d="M394 250 C420 300, 425 330, 438 348"/>
    <path d="M394 483 C420 430, 425 392, 438 372"/>
    <path d="M622 360 L666 360"/>
  </g>

  <!-- ================= GEOMETRY (local niche) ================= -->
  <text x="45" y="650" font-size="19" font-weight="bold" fill="#3a7d44">Geometry &#8212; local k-NN niche</text>

  <!-- niche i -->
  <g>
    <line x1="120" y1="740" x2="70" y2="710" stroke="#9bbf97" stroke-width="1.6"/>
    <line x1="120" y1="740" x2="80" y2="785" stroke="#9bbf97" stroke-width="1.6"/>
    <line x1="120" y1="740" x2="170" y2="712" stroke="#9bbf97" stroke-width="1.6"/>
    <line x1="120" y1="740" x2="175" y2="775" stroke="#9bbf97" stroke-width="1.6"/>
    <line x1="120" y1="740" x2="120" y2="800" stroke="#9bbf97" stroke-width="1.6"/>
    <circle cx="120" cy="740" r="7" fill="#2c6fbb"/>
    <circle cx="70" cy="710" r="4.5" fill="#bcd7ea"/><circle cx="80" cy="785" r="4.5" fill="#bcd7ea"/><circle cx="170" cy="712" r="4.5" fill="#bcd7ea"/><circle cx="175" cy="775" r="4.5" fill="#bcd7ea"/><circle cx="120" cy="800" r="4.5" fill="#bcd7ea"/>
    <text x="120" y="835" font-size="12.5" text-anchor="middle" fill="#333">niche of fibre i</text>
  </g>
  <!-- niche j -->
  <g>
    <line x1="330" y1="740" x2="282" y2="712" stroke="#e0b877" stroke-width="1.6"/>
    <line x1="330" y1="740" x2="290" y2="787" stroke="#e0b877" stroke-width="1.6"/>
    <line x1="330" y1="740" x2="382" y2="715" stroke="#e0b877" stroke-width="1.6"/>
    <line x1="330" y1="740" x2="385" y2="778" stroke="#e0b877" stroke-width="1.6"/>
    <line x1="330" y1="740" x2="330" y2="802" stroke="#e0b877" stroke-width="1.6"/>
    <circle cx="330" cy="740" r="7" fill="#c98a2b"/>
    <circle cx="282" cy="712" r="4.5" fill="#f0dcc0"/><circle cx="290" cy="787" r="4.5" fill="#f0dcc0"/><circle cx="382" cy="715" r="4.5" fill="#f0dcc0"/><circle cx="385" cy="778" r="4.5" fill="#f0dcc0"/><circle cx="330" cy="802" r="4.5" fill="#f0dcc0"/>
    <text x="330" y="835" font-size="12.5" text-anchor="middle" fill="#333">niche of fibre j</text>
  </g>

  <!-- distance dist + wasserstein -->
  <g transform="translate(455,700)">
    <text x="60" y="-8" font-size="12.5" text-anchor="middle" fill="#333">k-NN distance sets</text>
    <g fill="#bcd7ea" stroke="#2c6fbb" stroke-width="1">
      <rect x="0" y="40" width="12" height="20"/><rect x="14" y="30" width="12" height="30"/><rect x="28" y="18" width="12" height="42"/>
    </g>
    <g fill="#f0dcc0" stroke="#c98a2b" stroke-width="1">
      <rect x="70" y="43" width="12" height="17"/><rect x="84" y="32" width="12" height="28"/><rect x="98" y="20" width="12" height="40"/>
    </g>
    <text x="60" y="82" font-size="12.5" text-anchor="middle" fill="#3a7d44">Wasserstein &#8594;</text>
  </g>

  <!-- G node -->
  <rect x="670" y="712" width="120" height="60" rx="8" fill="#edf5ec" stroke="#3a7d44" stroke-width="2.2"/>
  <text x="730" y="740" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">G[i,j]</text>
  <text x="730" y="759" font-size="11.5" text-anchor="middle" fill="#555">local niche</text>
  <text x="600" y="792" font-size="12" text-anchor="middle" fill="#666">multiscale k = 3, 5, 7</text>

  <g stroke="#222" stroke-width="2" fill="none" marker-end="url(#a2)">
    <path d="M400 742 L448 742"/><path d="M578 742 L666 742"/>
  </g>

  <!-- combine -->
  <circle cx="880" cy="550" r="22" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="880" y="557" font-size="22" text-anchor="middle" fill="#111">&#215;</text>
  <rect x="940" y="512" width="150" height="76" rx="10" fill="#fbeee0" stroke="#b9772a" stroke-width="2.4"/>
  <text x="1015" y="545" font-size="16" text-anchor="middle" font-weight="bold" fill="#111">cost C[i,j]</text>
  <text x="1015" y="568" font-size="12" text-anchor="middle" fill="#b9772a">(local score)</text>
  <g stroke="#222" stroke-width="2" fill="none" marker-end="url(#a2)">
    <path d="M792 360 C840 420, 855 500, 862 535"/>
    <path d="M792 742 C840 680, 855 600, 862 566"/>
    <path d="M902 550 L936 550"/>
  </g>

  <!-- ================= RATIONALE PANEL ================= -->
  <rect x="1140" y="130" width="720" height="720" rx="14" fill="#faf9f6" stroke="#d8d2c6" stroke-width="1.5"/>
  <text x="1170" y="172" font-size="22" font-weight="bold" fill="#111">Concept &amp; rationale</text>

  <text x="1170" y="222" font-size="17" font-weight="bold" fill="#b9772a">1 &#183; Both terms are LOCAL</text>
  <text x="1170" y="248" font-size="15" fill="#333">Each fibre is characterised only by itself and its immediate</text>
  <text x="1170" y="270" font-size="15" fill="#333">neighbourhood &#8212; neither term sees the section-wide layout.</text>

  <text x="1170" y="318" font-size="17" font-weight="bold" fill="#2c6fbb">2 &#183; Context-aware appearance</text>
  <text x="1170" y="344" font-size="15" fill="#333">The 256-px patch (and the VAE reconstruction target) include</text>
  <text x="1170" y="366" font-size="15" fill="#333">the neighbouring fibres, so &#956; encodes the fibre <tspan font-style="italic">in its</tspan></text>
  <text x="1170" y="388" font-size="15" fill="#333"><tspan font-style="italic">surroundings</tspan>. In a field of near-identical fibres, the local</text>
  <text x="1170" y="410" font-size="15" fill="#333">neighbour arrangement is far more distinctive than one silhouette.</text>

  <text x="1170" y="458" font-size="17" font-weight="bold" fill="#3a7d44">3 &#183; Complementary geometry</text>
  <text x="1170" y="484" font-size="15" fill="#333">The k-NN niche is appearance-blind but invariant to global</text>
  <text x="1170" y="506" font-size="15" fill="#333">translation / rotation / scale; the classifier is stain-invariant</text>
  <text x="1170" y="528" font-size="15" fill="#333">but confused by look-alikes. Orthogonal &#8658; together they</text>
  <text x="1170" y="550" font-size="15" fill="#333">disambiguate what either alone cannot.</text>

  <text x="1170" y="598" font-size="17" font-weight="bold" fill="#c0392b">4 &#183; What local evidence CANNOT do</text>
  <text x="1170" y="624" font-size="15" fill="#333">It proposes candidates but cannot decide which of many locally-</text>
  <text x="1170" y="646" font-size="15" fill="#333">similar fibres is the true partner. Resolving that needs a wider</text>
  <text x="1170" y="668" font-size="15" fill="#333">spatial scale &#8212; supplied by the matcher in <tspan font-weight="bold">Step &#9314;</tspan>.</text>

  <rect x="1170" y="710" width="660" height="106" rx="10" fill="#fff" stroke="#b9772a" stroke-width="1.6"/>
  <text x="1185" y="742" font-size="15" font-weight="bold" fill="#b9772a">Invariances built in here</text>
  <text x="1185" y="768" font-size="14.5" fill="#333">&#8226; appearance &#8869; stain / imaging modality (flow-field input)</text>
  <text x="1185" y="790" font-size="14.5" fill="#333">&#8226; niche &#8869; global translation, rotation, scale (relative distances)</text>
  <text x="1185" y="810" font-size="14.5" fill="#333">&#8226; Wasserstein &#8869; a neighbour gained / lost (segmentation noise)</text>
</svg>
